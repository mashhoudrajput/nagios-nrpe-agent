[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/apache2.log
stderr_logfile=/var/log/supervisor/apache2_err.log
priority=10

[program:nagios]
command=/usr/local/nagios/bin/nagios /usr/local/nagios/etc/nagios.cfg
user=nagios
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nagios.log
stderr_logfile=/var/log/supervisor/nagios_err.log
priority=20

[program:nagios-api]
command=/usr/bin/node /opt/nagios-api/server.js
directory=/opt/nagios-api
user=nagios
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nagios-api.log
stderr_logfile=/var/log/supervisor/nagios-api_err.log
environment=NODE_ENV=production,PORT=8080
priority=30
